name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ripgrep
        run: brew install ripgrep
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
